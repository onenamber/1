<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammed AL-Yamani — 3D Mark</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fefefe}
body{
  font-family:"Manrope",system-ui,sans-serif;
  color:#0c1a32;
  -webkit-font-smoothing:antialiased;
}
#canvas-wrap{
  position:fixed;inset:0;
  background:
    radial-gradient(1200px 800px at 50% 35%, #ffffff 0%, #fdfcfa 45%, #f5f1e9 100%),
    radial-gradient(600px 600px at 20% 80%, rgba(201,168,106,0.08) 0%, transparent 70%),
    radial-gradient(600px 600px at 80% 80%, rgba(10,25,49,0.06) 0%, transparent 70%);
}
#canvas-wrap canvas{display:block;width:100%;height:100%}
.vignette{
  pointer-events:none;position:fixed;inset:0;
  background:radial-gradient(120% 90% at 50% 45%, transparent 60%, rgba(0,0,0,0.04) 100%);
}
.ui{
  position:fixed;inset:0;
  pointer-events:none;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:28px 32px;
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:auto;
}
.wordmark{
  display:flex;align-items:center;gap:12px;
  letter-spacing:0.28em;font-size:10px;font-weight:600;text-transform:uppercase;
  color:#0c1a32;opacity:0.9;
}
.wordmark i{
  font-family:"Instrument Serif",serif;font-style:italic;font-size:18px;letter-spacing:0.02em;text-transform:none;font-weight:400;
}
.pill{
  border:1px solid rgba(12,26,50,0.12);
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(12px);
  border-radius:999px;
  padding:8px 14px;
  font-size:10px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;
  display:flex;gap:10px;align-items:center;
}
.pill b{width:6px;height:6px;background:#c9a86a;transform:rotate(45deg);display:inline-block}
.bottom{
  display:flex;flex-direction:column;align-items:center;
  gap:14px;
  pointer-events:auto;
  padding-bottom:8px;
}
.brand{
  text-align:center;
}
.brand-name{
  font-family:"Manrope",sans-serif;
  font-weight:300;
  font-size:clamp(22px, 3.2vw, 36px);
  letter-spacing:0.04em;
  color:#0c1a32;
  line-height:1;
}
.brand-name span{font-weight:500;letter-spacing:0.06em}
.ornament{
  display:flex;align-items:center;gap:18px;margin-top:16px;justify-content:center;
}
.ornament .line{
  width:96px;height:1px;background:linear-gradient(90deg, transparent, #c9a86a 20%, #c9a86a 80%, transparent);
  opacity:0.9;
}
.ornament .diamond{
  width:9px;height:9px;background:#c9a86a;transform:rotate(45deg);
  box-shadow:0 0 0 6px rgba(201,168,106,0.12);
}
.hint{
  font-size:10px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.45;font-weight:600;margin-top:4px;
}
.controls{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;
  pointer-events:auto;
}
.ctrl-btn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(12,26,50,0.12);
  background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);
  display:grid;place-items:center;
  cursor:pointer;transition:0.25s;
  color:#0c1a32;
}
.ctrl-btn:hover{background:#0c1a32;color:#fff;transform:scale(1.05)}
.ctrl-btn svg{width:18px;height:18px}
#loader{
  position:fixed;inset:0;background:#fefefe;z-index:20;
  display:grid;place-items:center;transition:opacity 0.8s ease, visibility 0.8s;
}
#loader.hide{opacity:0;visibility:hidden}
.loader-mark{
  width:64px;height:64px;position:relative;
}
.loader-mark span{
  position:absolute;inset:0;border:1px solid rgba(12,26,50,0.12);transform:rotate(45deg);
  animation:load 1.6s infinite;
}
.loader-mark span:nth-child(2){inset:10px;border-color:#c9a86a;animation-delay:0.2s}
@keyframes load{0%{transform:rotate(45deg) scale(0.8);opacity:0}50%{opacity:1}100%{transform:rotate(45deg) scale(1.1);opacity:0}}
@media(max-width:700px){
  .ui{padding:18px}
  .controls{right:12px;top:auto;bottom:110px;transform:none;flex-direction:row}
  .ornament .line{width:56px}
}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div class="vignette"></div>

<div id="loader"><div class="loader-mark"><span></span><span></span></div></div>

<div class="ui">
  <div class="topbar">
    <div class="wordmark"><i>MAY</i> — MONOGRAM STUDY • 2024</div>
    <div class="pill"><b></b> 3D EXTRUDED MARK / PBR</div>
  </div>
  <div class="bottom">
    <div class="brand">
      <div class="brand-name">Mohammed <span>AL-Yamani</span></div>
      <div class="ornament"><div class="line"></div><div class="diamond"></div><div class="line"></div></div>
      <div class="hint">drag to orbit • scroll to zoom • double-click to recenter</div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn" id="btn-wire" title="Toggle Material">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 3l7 4v8l-7 4-7-4V7l7-4z"/><path d="M12 3v18M5 7l7 4 7-4M5 17l7-4 7 4"/></svg>
  </button>
  <button class="ctrl-btn" id="btn-spin" title="Auto Spin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M21 12a9 9 0 11-9-9"/><path d="M21 12v-4h-4"/></svg>
  </button>
  <button class="ctrl-btn" id="btn-reset" title="Reset View">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg>
  </button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = null;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
wrap.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.2, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 8;
controls.target.set(0,0,0);
controls.enablePan = false;
controls.maxPolarAngle = Math.PI*0.52;
controls.minPolarAngle = Math.PI*0.28;

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff6e5, 1.4);
key.position.set(2.5, 3.5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 12;
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0002;
scene.add(key);

const fill = new THREE.DirectionalLight(0xc8d8ff, 0.6);
fill.position.set(-2.5, 1.5, 2);
scene.add(fill);

const rim = new THREE.PointLight(0xc9a86a, 0.9, 10);
rim.position.set(0, 2, -1.5);
scene.add(rim);

// Ground shadow catcher
const shadowMat = new THREE.ShadowMaterial({ opacity:0.14 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(12,12), shadowMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.25;
ground.receiveShadow = true;
scene.add(ground);

// Materials
const navyMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a1931,
  metalness: 0.15,
  roughness: 0.35,
  clearcoat: 0.6,
  clearcoatRoughness: 0.3,
  envMapIntensity: 0.6
});
const navyMatFlat = new THREE.MeshStandardMaterial({ color:0x0a1931, roughness:0.5, metalness:0.1 });

const goldMat = new THREE.MeshPhysicalMaterial({
  color: 0xd3b16a,
  metalness: 0.85,
  roughness: 0.28,
  clearcoat: 0.8,
  clearcoatRoughness: 0.2,
  emissive: 0x221800,
  emissiveIntensity: 0.08,
  envMapIntensity: 1.1
});
const goldMatFlat = new THREE.MeshStandardMaterial({ color:0xc9a86a, roughness:0.4, metalness:0.35 });

let usePBR = true;

// Helpers to create extruded mesh
function extrude(shape, mat, depth=0.22, z=0, bevel=true){
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: bevel,
    bevelThickness: 0.028,
    bevelSize: 0.018,
    bevelSegments: 4,
    curveSegments: 18
  });
  geo.computeVertexNormals();
  geo.center();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.z = z;
  // store original for centering correction
  return mesh;
}

// === SHAPES ===
// Gold A - thick hollow triangle
function makeGoldA(){
  const s = new THREE.Shape();
  s.moveTo(0, 1.18);
  s.lineTo(-0.70, -0.22);
  s.lineTo(-0.38, -0.04);
  s.lineTo(0, 0.74);
  s.lineTo(0.38, -0.04);
  s.lineTo(0.70, -0.22);
  s.closePath();
  return s;
}
function makeGoldDiamond(){
  const s = new THREE.Shape();
  s.moveTo(0, 0.22);
  s.lineTo(0.18, 0.02);
  s.lineTo(0, -0.18);
  s.lineTo(-0.18, 0.02);
  s.closePath();
  return s;
}
function makeGoldY(){
  const s = new THREE.Shape();
  // bottom stem
  s.moveTo(-0.105, -0.95);
  s.lineTo(0.105, -0.95);
  s.lineTo(0.105, -0.36);
  // right arm outer
  s.bezierCurveTo(0.28, -0.22, 0.62, -0.02, 0.88, 0.38);
  s.lineTo(0.82, 0.44);
  // right arm inner
  s.bezierCurveTo(0.48, 0.14, 0.18, -0.08, 0, -0.20);
  // left arm inner
  s.bezierCurveTo(-0.18, -0.08, -0.48, 0.14, -0.82, 0.44);
  s.lineTo(-0.88, 0.38);
  // left arm outer
  s.bezierCurveTo(-0.62, -0.02, -0.28, -0.22, -0.105, -0.36);
  s.closePath();
  return s;
}
function makeNavyLeftTop(){
  const s = new THREE.Shape();
  s.moveTo(-1.08, 1.32);
  s.lineTo(-1.08, -0.12);
  s.lineTo(-0.90, -0.32);
  s.bezierCurveTo(-0.74, -0.12, -0.62, 0.02, -0.52, 0.14);
  s.lineTo(-0.52, 0.66);
  s.lineTo(-0.14, 0.12);
  s.lineTo(-0.34, 0.38);
  s.lineTo(-1.08, 1.32);
  return s;
}
function makeNavyLeftBot(){
  const s = new THREE.Shape();
  s.moveTo(-1.08, -0.38);
  s.lineTo(-1.08, -0.78);
  s.lineTo(-0.68, -1.22);
  s.lineTo(-0.40, -0.90);
  s.lineTo(-0.62, -0.56);
  s.bezierCurveTo(-0.78, -0.36, -0.92, -0.28, -1.08, -0.38);
  return s;
}
function makeNavyRightTop(){
  const s = new THREE.Shape();
  s.moveTo(1.08, 1.32);
  s.lineTo(0.34, 0.38);
  s.lineTo(0.14, 0.12);
  s.lineTo(0.52, 0.66);
  s.lineTo(0.52, 0.14);
  s.bezierCurveTo(0.62, 0.02, 0.74, -0.12, 0.90, -0.32);
  s.lineTo(1.08, -0.12);
  s.closePath();
  return s;
}
function makeNavyRightBot(){
  const s = new THREE.Shape();
  s.moveTo(1.08, -0.38);
  s.lineTo(0.92, -0.28);
  s.lineTo(0.78, -0.36);
  s.lineTo(0.62, -0.56);
  s.lineTo(0.40, -0.90);
  s.lineTo(0.68, -1.22);
  s.lineTo(1.08, -0.78);
  s.closePath();
  return s;
}

// Build logo group
const logoGroup = new THREE.Group();
scene.add(logoGroup);

const gA = extrude(makeGoldA(), goldMat, 0.28, 0.18);
const gY = extrude(makeGoldY(), goldMat, 0.30, 0.22);
const gD = extrude(makeGoldDiamond(), goldMat, 0.22, 0.26);

const nLT = extrude(makeNavyLeftTop(), navyMat, 0.20, 0.0);
const nLB = extrude(makeNavyLeftBot(), navyMat, 0.20, 0.0);
const nRT = extrude(makeNavyRightTop(), navyMat, 0.20, 0.0);
const nRB = extrude(makeNavyRightBot(), navyMat, 0.20, 0.0);

logoGroup.add(nLT, nLB, nRT, nRB, gA, gD, gY);

// Slight scale to fit
logoGroup.scale.set(1.05,1.05,1.05);
logoGroup.position.y = 0.18;

// Add subtle floating light disk behind
const backDisk = new THREE.Mesh(
  new THREE.CircleGeometry(1.6, 64),
  new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.0 })
);
backDisk.position.z = -0.4;
logoGroup.add(backDisk);

// Animation state
let autoSpin = true;
let t = 0;
let targetRotY = 0;
let currentRotY = 0;

function animate(){
  requestAnimationFrame(animate);
  t += 0.01;
  if(autoSpin){
    targetRotY = Math.sin(t*0.35)*0.35;
  }
  currentRotY += (targetRotY - currentRotY)*0.06;
  logoGroup.rotation.y = currentRotY;
  logoGroup.rotation.x = Math.sin(t*0.22)*0.06;
  logoGroup.position.y = 0.18 + Math.sin(t*0.6)*0.04;

  // gold shimmer
  if(usePBR){
    goldMat.emissiveIntensity = 0.06 + Math.sin(t*1.2)*0.02;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Interaction
let isDragging=false;
renderer.domElement.addEventListener('pointerdown', ()=>{ isDragging=true; autoSpin=false; });
renderer.domElement.addEventListener('pointerup', ()=>{ isDragging=false; });
renderer.domElement.addEventListener('pointermove', (e)=>{
  if(isDragging){
    targetRotY += e.movementX*0.008;
  }
});
renderer.domElement.addEventListener('dblclick', ()=>{
  targetRotY=0; controls.target.set(0,0,0);
  camera.position.set(0,0.2,5.2);
  autoSpin=true;
});

// Buttons
document.getElementById('btn-reset').onclick = ()=>{
  targetRotY=0; autoSpin=true;
  controls.target.set(0,0,0);
  camera.position.set(0,0.2,5.2);
};
document.getElementById('btn-spin').onclick = (e)=>{
  autoSpin=!autoSpin;
  e.currentTarget.style.background = autoSpin ? '#0c1a32' : '';
  e.currentTarget.style.color = autoSpin ? '#fff' : '';
};
document.getElementById('btn-wire').onclick = ()=>{
  usePBR=!usePBR;
  [gA,gY,gD].forEach(m=>{
    m.material = usePBR ? goldMat : goldMatFlat;
  });
  [nLT,nLB,nRT,nRB].forEach(m=>{
    m.material = usePBR ? navyMat : navyMatFlat;
  });
};

// Loader hide
setTimeout(()=>document.getElementById('loader').classList.add('hide'), 600);

// Subtle parallax on mouse
let mx=0, my=0;
addEventListener('mousemove', (e)=>{
  mx = (e.clientX/innerWidth -0.5)*0.4;
  my = (e.clientY/innerHeight -0.5)*0.2;
});
(function parallax(){
  requestAnimationFrame(parallax);
  logoGroup.position.x += (mx - logoGroup.position.x)*0.04;
  // camera slight
  camera.position.x += (mx*0.6 - camera.position.x + 0)*0.02;
})();
</script>
</body>
</html>
